# Open edX settings the AthenIQ estate adds.
#
# This is **YAML**, read by Django as `lms.env.yml` — it is mounted, never
# passed through `env_file` (which would hand the container a dict-shaped
# environment variable and no settings at all).
#
# Nothing here is a template: values are literal, because neither Compose nor
# Open edX expands `${…}` in this file. Copy it and change the hosts for a
# different estate; keep it out of version control if the hosts are private.
#
# The patch series does not modify Open edX source. The LMS already exposes the
# two endpoints the bridge needs — completion-batch and the gradebook bulk
# update — so what it needs from us is the estate's host names and permission
# to keep the gradebook writable.

SITE_NAME: atheniq.institute
LMS_BASE: https://courses.atheniq.institute
CMS_BASE: https://studio.atheniq.institute

# The console is the academic record; the classroom is the instruction surface.
# Both are trusted origins for CORS and for post-login redirects.
CORS_ORIGIN_WHITELIST:
  - https://registrar.atheniq.institute
  - https://classroom.atheniq.institute

LOGIN_REDIRECT_WHITELIST:
  - https://registrar.atheniq.institute
  - https://classroom.atheniq.institute

# Completion writes are per-learner and need no course-author role; a grade
# override does, and is gated per course by this flag. The bridge's service user
# is created by deploy/openedx/provision-bridge.sh, which also grants the
# per-course staff role that the gradebook write checks.
FEATURES:
  WRITABLE_GRADEBOOK: true

# Without this the completion API records progress the progress page ignores.
ENABLE_COMPLETION_TRACKING: true

OAUTH2_PROVIDER:
  SCOPES:
    - read
    - write
    - profile
