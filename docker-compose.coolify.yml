# Coolify resource: AthenIQ Institute site and registrar
#
# One container serves two hostnames. Nginx Proxy Manager (the "cerulean" edge)
# fronts this service directly; Coolify's Traefik proxy is not in the path.
# The container publishes host port 8098, and NPM forwards both names to it:
#
#   https://atheniq.innotel.site    -> http://192.168.1.52:8098
#   https://registrar.innotel.site  -> http://192.168.1.52:8098
#
# `registrar.innotel.site` is the registrar surface of this service (admissions,
# account issuance, roster), not the AthenIQ console on port 3100. The console is
# a separate Next.js app and is not published by this resource.
#
# The hostname decides the surface, so `TRUST_PROXY` must stay true behind
# Coolify's proxy. See deploy/coolify/README.md for the full procedure.

services:
  # The registry volume is created by Docker as root, but the service runs as
  # the image's `node` user (uid 1000). Without this one-shot step a fresh
  # volume makes the first write fail and the container restart-loop. It runs
  # to completion before `institution` starts, and is a no-op afterwards.
  data-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data && chmod 0755 /data"]
    volumes:
      - institution-data:/data

  institution:
    build:
      context: ./apps/institution
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "8080"
      INSTITUTION_ORIGIN: ${INSTITUTION_ORIGIN:-https://atheniq.innotel.site}
      REGISTRAR_ORIGIN: ${REGISTRAR_ORIGIN:-https://registrar.innotel.site}
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      # Empty is allowed so a fresh install can run /setup. A non-empty value
      # still wins over the setup file.
      SESSION_SECRET: ${SESSION_SECRET:-}
      REGISTRAR_EMAIL: ${REGISTRAR_EMAIL:-}
      REGISTRAR_PASSWORD_HASH: ${REGISTRAR_PASSWORD_HASH:-}
      REGISTRAR_PASSWORD: ${REGISTRAR_PASSWORD:-}
      INSTITUTION_DATA_DIR: /data
      INSTITUTION_SEED_DEMO: ${INSTITUTION_SEED_DEMO:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      STALWART_URL: ${STALWART_URL:-}
      STALWART_TOKEN: ${STALWART_TOKEN:-}
      STALWART_QUOTA_BYTES: ${STALWART_QUOTA_BYTES:-0}
      # Empty on purpose: no console is published here, so the portal hides the
      # link instead of pointing at a host that does not answer.
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:-}
      CREDENTIAL_VERIFY_URL: ${CREDENTIAL_VERIFY_URL:-}
    expose:
      - "8080"
    ports:
      - "8098:8080"
    volumes:
      - institution-data:/data

volumes:
  institution-data:

