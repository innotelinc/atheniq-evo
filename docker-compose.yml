# atheniq-evo — the estate, locally.
#
# The default profile is the integration: the bridge, the AI classroom and the
# console, on one network, wired to each other and to OmniRoute.
#
# Open edX is large and has its own upstream deployment guide, so it is an
# opt-in profile rather than a default service. Signara is not run from this
# file at all — it brings its own database, cache, storage and search:
#
#   docker compose up -d                          # bridge + classroom + console
#   docker compose --profile lms up -d            # + Open edX LMS and CMS
#   Signara is not a service here: it needs its own PostgreSQL, Redis, ONYX
#   bucket, Meilisearch and Authentik application. See deploy/signara/README.md.
#
# ── Where values may live ────────────────────────────────────────────────────
# Compose interpolates `${VAR}` in *this file* (and in `environment:`), but NOT
# inside a file referenced by `env_file:` — those are copied into the container
# literally. So:
#
#   env_file:      only literal files (.env). Never a file with ${…} in it.
#   environment:   anything derived from another value, `${…}` is expanded here.
#   YAML settings:   mounted as YAML (deploy/openedx/lms.env.yml), never env_file.
#
# `npm run check:compose` (part of `npm run check`) fails the build if a file
# passed via env_file ever contains `${…}` again.

name: atheniq-evo

services:
  bridge:
    build:
      context: .
      dockerfile: apps/bridge/Dockerfile
    restart: unless-stopped
    # .env holds literal values only, so copying it is safe and intended here:
    # the bridge is the one service that legitimately reads most of them.
    env_file: .env
    environment:
      PORT: 8787
      ATHENIQ_ORG: ${ATHENIQ_ORG:-AthenIQ Institute}
      BRIDGE_ORIGIN: ${BRIDGE_ORIGIN:-http://localhost:8787}
      BRIDGE_DATA_DIR: /data
      OPENMAIC_BASE_URL: http://openmaic:3000
      CONSOLE_BASE_URL: http://console:3100
    volumes:
      - bridge-data:/data
    ports:
      # Loopback only: the bridge is internal and answers the institution and
      # OpenMAIC over the Compose network. A public hostname is never its job.
      - "127.0.0.1:${BRIDGE_PORT:-8787}:8787"
    networks: [atheniq]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  openmaic:
    # CI builds and proves this image (`.github/workflows/build-openmaic-image.yml`)
    # and publishes it to Docker Hub, so `up` here pulls it instead of spending
    # ~15 minutes compiling. With both `image` and `build`, Compose pulls first
    # and only builds from source when the reference cannot be fetched.
    #
    # Pinned by **digest**, not by `:latest`: the tag is repointed on every push
    # to main, so a `pull` under it can quietly swap the classroom for a build
    # nobody proved. The digest names one manifest and cannot move; bump it from
    # the digest the image workflow prints in its run summary.
    #
    # The pinned image carries the frame origin CI resolved: the
    # OPENMAIC_FRAME_ANCESTORS of .env.example, `https://registrar.atheniq.institute`.
    # A different ancestor has to be compiled here, and that local build must
    # then be started without pulling over it — and under a tag, because a
    # digest reference cannot be built onto:
    #   OPENMAIC_IMAGE=openmaic:local OPENMAIC_FRAME_ANCESTORS=https://example.org \
    #     docker compose build openmaic
    #   OPENMAIC_IMAGE=openmaic:local docker compose up -d --pull never openmaic
    #
    # Either way, prove the running image's policy against this estate:
    #   npm run check:openmaic-csp
    image: "${OPENMAIC_IMAGE:-docker.io/innotel/atheniq-evo-openmaic@sha256:fd0e3757eb7c8670b37c6122ba23ed1135ae8602c2de124df47daedf1a4a0a92}"
    build:
      context: ./upstream/OpenMAIC
      args:
        # OpenMAIC's build-time CSP allows framing by 'self' and by these origins
        # only, and its default `X-Frame-Options: SAMEORIGIN` is dropped when a
        # list is given. Space-separate several. Without this the registrar's
        # classroom iframe is refused even though the cookie is correct.
        ALLOWED_FRAME_ANCESTORS: ${OPENMAIC_FRAME_ANCESTORS:-https://registrar.atheniq.institute}
    restart: unless-stopped
    env_file: .env
    environment:
      # ── estate ────────────────────────────────────────────────────────────
      ATHENIQ_ORG: ${ATHENIQ_ORG:-AthenIQ Institute}
      DATABASE_URL: postgres://openmaic:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/openmaic
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=2048
      # ── AthenIQ identity + completion callback ────────────────────────────
      # Expanded here, from .env: an env_file copy would arrive as the literal
      # text "${BRIDGE_JWT_SECRET}" and every classroom token would fail to
      # verify — a failure that looks like a signature bug, not a config one.
      ATHENIQ_BRIDGE_JWT_SECRET: ${BRIDGE_JWT_SECRET:?set BRIDGE_JWT_SECRET in .env}
      ATHENIQ_BRIDGE_URL: http://bridge:8787
      ATHENIQ_BRIDGE_HOOK_SECRET: ${BRIDGE_HOOK_SECRET:?set BRIDGE_HOOK_SECRET in .env}
      # ── ownership ─────────────────────────────────────────────────────────
      # The bridge is the identity source; this install is not a personal one.
      OWNER_SINGLE_USER: "false"
    volumes:
      - openmaic-data:/app/data
      - ./deploy/openmaic/openmaic.yml:/app/openmaic.yml:ro
    ports:
      - "${OPENMAIC_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      bridge:
        condition: service_started
    networks: [atheniq]

  # The classroom's frame policy is baked at build time, so a running container
  # can disagree with this estate and still look healthy: the registrar's iframe
  # is simply blank. This one-shot service asks the classroom what it actually
  # serves and exits non-zero when that is not OPENMAIC_FRAME_ANCESTORS.
  #
  # It is behind a profile so a plain `up` does not start it; bring the estate up
  # with `npm run up`, which runs `docker compose up -d --wait` and then this, and
  # stops with an error instead of reporting a stack that cannot show a classroom:
  #
  #   npm run up
  #   docker compose run --rm --no-deps csp-check   # on its own, later
  csp-check:
    profiles: [csp]
    image: node:22-alpine
    depends_on:
      - openmaic
    command: [
      "node",
      "/check/check-openmaic-csp.mjs",
      "--url",
      "http://openmaic:3000/",
      # The value this estate asked for. The image cannot change this; only a
      # build or a pull can, and that is exactly what is being compared.
      "--expect",
      "${OPENMAIC_FRAME_ANCESTORS:-https://registrar.atheniq.institute}",
      # The classroom is a Next.js app: up to 60 s from start to answering.
      "--attempts",
      "30",
    ]
    volumes:
      - ./scripts/check-openmaic-csp.mjs:/check/check-openmaic-csp.mjs:ro
    restart: "no"
    networks: [atheniq]

  console:
    build:
      context: ./upstream/atheniq-console
      args:
        # Next inlines this into the middleware at build time; the runtime value
        # below cannot change a built image. Rebuild to move the redirect target.
        INSTITUTION_CONSOLE_URL: ${INSTITUTION_CONSOLE_URL:-https://registrar.atheniq.institute}
    restart: unless-stopped
    env_file: .env
    environment:
      ATHENIQ_ORG: ${ATHENIQ_ORG:-AthenIQ Institute}
      ATHENIQ_BRIDGE_URL: http://bridge:8787
      # The console accepts the bridge's service calls with this value; it is
      # the same secret, named from the console's side.
      ATHENIQ_BRIDGE_SERVICE_TOKEN: ${BRIDGE_SERVICE_TOKEN:?set BRIDGE_SERVICE_TOKEN in .env}
      ATHENIQ_CLASSROOM_COOKIE_DOMAIN: ${CLASSROOM_COOKIE_DOMAIN:-}
      LMS_BASE_URL: ${LMS_PUBLIC_URL:-http://localhost:18000}
      CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-http://localhost:3100}
      # AthenIQ Plus. The secret key lets the console read a learner's store
      # entitlement; the webhook token authenticates RevenueCat's events. Empty
      # means the paywall is closed and nothing is granted.
      REVENUECAT_SECRET_KEY: ${REVENUECAT_SECRET_KEY:-}
      REVENUECAT_WEBHOOK_TOKEN: ${REVENUECAT_WEBHOOK_TOKEN:-}
      REVENUECAT_ENTITLEMENT_ID: ${REVENUECAT_ENTITLEMENT_ID:-plus}
      # Course authoring is the institution's. This app's /courses and /generate
      # answer 308 to this URL rather than offering a second catalog.
      INSTITUTION_CONSOLE_URL: ${INSTITUTION_CONSOLE_URL:-https://registrar.atheniq.institute}
    volumes:
      - console-data:/app/data
    ports:
      - "${CONSOLE_PORT:-3100}:3100"
    depends_on:
      bridge:
        condition: service_started
    networks: [atheniq]

  # The institution: the public site on atheniq.institute and the registrar on
  # registrar.atheniq.institute, one process. Host routing means the edge must
  # preserve the Host header and terminate TLS for both names.
  institution:
    build:
      context: ./apps/institution
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8080
      NODE_ENV: production
      INSTITUTION_ORIGIN: ${INSTITUTION_ORIGIN:-https://atheniq.institute}
      REGISTRAR_ORIGIN: ${REGISTRAR_ORIGIN:-https://registrar.atheniq.institute}
      INSTITUTION_DATA_DIR: /data
      # Signs student and staff session cookies. Required; 32+ characters.
      # Empty is allowed so a fresh install can boot the setup wizard; the
      # service still refuses to serve without a secret in production.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Bootstrap-owned values stay empty unless the operator sets them, so a
      # value written by /setup is not shadowed by a Compose default.
      REGISTRAR_EMAIL: ${REGISTRAR_EMAIL:-}
      # Set either the scrypt hash (preferred) or a bootstrap password. The
      # service refuses to start in production when both are empty.
      REGISTRAR_PASSWORD: ${REGISTRAR_PASSWORD:-}
      REGISTRAR_PASSWORD_HASH: ${REGISTRAR_PASSWORD_HASH:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      STALWART_URL: ${STALWART_URL:-}
      STALWART_TOKEN: ${STALWART_TOKEN:-}
      STALWART_QUOTA_BYTES: ${STALWART_QUOTA_BYTES:-0}
      ATHENIQ_BRIDGE_URL: http://bridge:8787
      ATHENIQ_BRIDGE_SERVICE_TOKEN: ${BRIDGE_SERVICE_TOKEN:?set BRIDGE_SERVICE_TOKEN in .env}
      # A browser link, so it must be the host the visitor can reach — not the
      # Compose service name. The bridge's own CONSOLE_BASE_URL stays internal.
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:-http://localhost:3100}
      # The console's course studio: generation through the estate's gateway and
      # the LMS catalog the sync reports against. The key stays server-side.
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-auto/best-chat}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      LMS_BASE_URL: ${LMS_PUBLIC_URL:-https://atheniq.courses}
      # The browser-reachable OpenMAIC origin for the embedded classroom, and
      # the parent domain that lets the iframe carry the classroom cookie.
      OPENMAIC_PUBLIC_URL: ${OPENMAIC_PUBLIC_URL:-}
      ATHENIQ_CLASSROOM_COOKIE_DOMAIN: ${CLASSROOM_COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # The institution is published through an edge that sets
      # X-Forwarded-For. Trusting it gives the sign-in limiter one bucket per
      # client instead of one shared bucket for the edge's address. Set false
      # only when :8080 is reachable directly, where forwarded headers are
      # client-controlled and must be ignored.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      INSTITUTION_SEED_DEMO: ${INSTITUTION_SEED_DEMO:-}
    volumes:
      - institution-data:/data
    ports:
      - "${INSTITUTION_PORT:-8080}:8080"
    depends_on:
      bridge:
        condition: service_started
    networks: [atheniq]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openmaic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: openmaic
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmaic -d openmaic"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [atheniq]

  # --------------------------------------------------------------- profiles --
  # Open edX is a multi-service deployment (LMS, CMS, workers, MySQL, MongoDB,
  # Redis, Elasticsearch). This profile runs the two Django processes against
  # the fork; production uses the fork's own image build. See docs/runbook.md.
  lms:
    profiles: [lms]
    build:
      context: ./upstream/openedx-platform
    command: ["gunicorn", "--bind", "0.0.0.0:18000", "lms.wsgi:application"]
    env_file: .env
    environment:
      SERVICE_VARIANT: lms
    volumes:
      # Open edX reads its settings as YAML. Passing this file through env_file
      # would have handed Django a dict-shaped "environment variable" and no
      # settings at all.
      - ./deploy/openedx/lms.env.yml:/openedx/config/lms.env.yml:ro
    ports:
      - "18000:18000"
    networks: [atheniq]

  cms:
    profiles: [lms]
    build:
      context: ./upstream/openedx-platform
    command: ["gunicorn", "--bind", "0.0.0.0:18010", "cms.wsgi:application"]
    env_file: .env
    environment:
      SERVICE_VARIANT: cms
    volumes:
      - ./deploy/openedx/lms.env.yml:/openedx/config/lms.env.yml:ro
    ports:
      - "18010:18010"
    networks: [atheniq]

  # Signara's API. Its database, object storage and OIDC provider are its own
  # deployment's concern (upstream ships docker-compose.prod.yml).
volumes:
  bridge-data:
  openmaic-data:
  console-data:
  institution-data:
  postgres-data:

networks:
  atheniq:
    driver: bridge
