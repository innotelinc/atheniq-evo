# atheniq-evo — the estate, locally.
#
# The default profile is the integration: the bridge, the AI classroom and the
# console, on one network, wired to each other and to OmniRoute.
#
# Open edX and Signara are large and have their own upstream deployment guides,
# so they are opt-in profiles rather than default services:
#
#   docker compose up -d                          # bridge + classroom + console
#   docker compose --profile lms up -d            # + Open edX LMS and CMS
#   docker compose --profile signara up -d        # + Signara's API
#
# ── Where values may live ────────────────────────────────────────────────────
# Compose interpolates `${VAR}` in *this file* (and in `environment:`), but NOT
# inside a file referenced by `env_file:` — those are copied into the container
# literally. So:
#
#   env_file:      only literal files (.env). Never a file with ${…} in it.
#   environment:   anything derived from another value, `${…}` is expanded here.
#   YAML settings:   mounted as YAML (deploy/openedx/lms.env.yml), never env_file.
#
# `npm run check:compose` (part of `npm run check`) fails the build if a file
# passed via env_file ever contains `${…}` again.

name: atheniq-evo

services:
  bridge:
    build:
      context: .
      dockerfile: apps/bridge/Dockerfile
    restart: unless-stopped
    # .env holds literal values only, so copying it is safe and intended here:
    # the bridge is the one service that legitimately reads most of them.
    env_file: .env
    environment:
      PORT: 8787
      ATHENIQ_ORG: ${ATHENIQ_ORG:-AthenIQ Institute}
      BRIDGE_ORIGIN: ${BRIDGE_ORIGIN:-http://localhost:8787}
      BRIDGE_DATA_DIR: /data
      OPENMAIC_BASE_URL: http://openmaic:3000
      CONSOLE_BASE_URL: http://console:3100
    volumes:
      - bridge-data:/data
    ports:
      - "${BRIDGE_PORT:-8787}:8787"
    networks: [atheniq]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  openmaic:
    build:
      context: ./upstream/OpenMAIC
    restart: unless-stopped
    env_file: .env
    environment:
      # ── estate ────────────────────────────────────────────────────────────
      ATHENIQ_ORG: ${ATHENIQ_ORG:-AthenIQ Institute}
      DATABASE_URL: postgres://openmaic:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/openmaic
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=2048
      # ── AthenIQ identity + completion callback ────────────────────────────
      # Expanded here, from .env: an env_file copy would arrive as the literal
      # text "${BRIDGE_JWT_SECRET}" and every classroom token would fail to
      # verify — a failure that looks like a signature bug, not a config one.
      ATHENIQ_BRIDGE_JWT_SECRET: ${BRIDGE_JWT_SECRET:?set BRIDGE_JWT_SECRET in .env}
      ATHENIQ_BRIDGE_URL: http://bridge:8787
      ATHENIQ_BRIDGE_HOOK_SECRET: ${BRIDGE_HOOK_SECRET:?set BRIDGE_HOOK_SECRET in .env}
      # ── ownership ─────────────────────────────────────────────────────────
      # The bridge is the identity source; this install is not a personal one.
      OWNER_SINGLE_USER: "false"
    volumes:
      - openmaic-data:/app/data
      - ./deploy/openmaic/openmaic.yml:/app/openmaic.yml:ro
    ports:
      - "${OPENMAIC_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      bridge:
        condition: service_started
    networks: [atheniq]

  console:
    build:
      context: ./upstream/atheniq-console
    restart: unless-stopped
    env_file: .env
    environment:
      ATHENIQ_ORG: ${ATHENIQ_ORG:-AthenIQ Institute}
      ATHENIQ_BRIDGE_URL: http://bridge:8787
      # The console accepts the bridge's service calls with this value; it is
      # the same secret, named from the console's side.
      ATHENIQ_BRIDGE_SERVICE_TOKEN: ${BRIDGE_SERVICE_TOKEN:?set BRIDGE_SERVICE_TOKEN in .env}
      ATHENIQ_CLASSROOM_COOKIE_DOMAIN: ${CLASSROOM_COOKIE_DOMAIN:-}
      LMS_BASE_URL: ${LMS_PUBLIC_URL:-http://localhost:18000}
      CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-http://localhost:3100}
    volumes:
      - console-data:/app/data
    ports:
      - "${CONSOLE_PORT:-3100}:3100"
    depends_on:
      bridge:
        condition: service_started
    networks: [atheniq]

  # The institution: the public site on atheniq.institute and the registrar on
  # registrar.atheniq.institute, one process. Host routing means the edge must
  # preserve the Host header and terminate TLS for both names.
  institution:
    build:
      context: ./apps/institution
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8080
      NODE_ENV: production
      INSTITUTION_ORIGIN: ${INSTITUTION_ORIGIN:-https://atheniq.institute}
      REGISTRAR_ORIGIN: ${REGISTRAR_ORIGIN:-https://registrar.atheniq.institute}
      INSTITUTION_DATA_DIR: /data
      # Signs student and staff session cookies. Required; 32+ characters.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      REGISTRAR_EMAIL: ${REGISTRAR_EMAIL:-registrar@atheniq.institute}
      # Set either the scrypt hash (preferred) or a bootstrap password. The
      # service refuses to start in production when both are empty.
      REGISTRAR_PASSWORD: ${REGISTRAR_PASSWORD:-}
      REGISTRAR_PASSWORD_HASH: ${REGISTRAR_PASSWORD_HASH:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-atheniq.institute}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-local}
      STALWART_URL: ${STALWART_URL:-}
      STALWART_TOKEN: ${STALWART_TOKEN:-}
      STALWART_QUOTA_BYTES: ${STALWART_QUOTA_BYTES:-0}
      ATHENIQ_BRIDGE_URL: http://bridge:8787
      ATHENIQ_BRIDGE_SERVICE_TOKEN: ${BRIDGE_SERVICE_TOKEN:?set BRIDGE_SERVICE_TOKEN in .env}
      # A browser link, so it must be the host the visitor can reach — not the
      # Compose service name. The bridge's own CONSOLE_BASE_URL stays internal.
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:-http://localhost:3100}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      INSTITUTION_SEED_DEMO: ${INSTITUTION_SEED_DEMO:-false}
    volumes:
      - institution-data:/data
    ports:
      - "${INSTITUTION_PORT:-8080}:8080"
    depends_on:
      bridge:
        condition: service_started
    networks: [atheniq]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openmaic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: openmaic
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmaic -d openmaic"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [atheniq]

  # --------------------------------------------------------------- profiles --
  # Open edX is a multi-service deployment (LMS, CMS, workers, MySQL, MongoDB,
  # Redis, Elasticsearch). This profile runs the two Django processes against
  # the fork; production uses the fork's own image build. See docs/runbook.md.
  lms:
    profiles: [lms]
    build:
      context: ./upstream/openedx-platform
    command: ["gunicorn", "--bind", "0.0.0.0:18000", "lms.wsgi:application"]
    env_file: .env
    environment:
      SERVICE_VARIANT: lms
    volumes:
      # Open edX reads its settings as YAML. Passing this file through env_file
      # would have handed Django a dict-shaped "environment variable" and no
      # settings at all.
      - ./deploy/openedx/lms.env.yml:/openedx/config/lms.env.yml:ro
    ports:
      - "18000:18000"
    networks: [atheniq]

  cms:
    profiles: [lms]
    build:
      context: ./upstream/openedx-platform
    command: ["gunicorn", "--bind", "0.0.0.0:18010", "cms.wsgi:application"]
    env_file: .env
    environment:
      SERVICE_VARIANT: cms
    volumes:
      - ./deploy/openedx/lms.env.yml:/openedx/config/lms.env.yml:ro
    ports:
      - "18010:18010"
    networks: [atheniq]

  # Signara's API. Its database, object storage and OIDC provider are its own
  # deployment's concern (upstream ships docker-compose.prod.yml).
  signara-api:
    profiles: [signara]
    build:
      context: ./upstream/signara
    env_file: .env
    environment:
      API_PUBLIC_URL: ${SIGNARA_API_URL:-https://api.signara.innotel.us}
      CORS_ORIGINS: ${CONSOLE_ORIGIN:-http://localhost:3100}
      # Never derived from a request Host header.
      TRUST_PROXY: "false"
    ports:
      - "4000:4000"
    networks: [atheniq]

volumes:
  bridge-data:
  openmaic-data:
  console-data:
  institution-data:
  postgres-data:

networks:
  atheniq:
    driver: bridge
