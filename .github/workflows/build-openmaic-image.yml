name: openmaic image

# The classroom image is a pinned upstream commit plus this repo's patch, and its
# CSP is fixed by a build argument, so it cannot be checked after the fact. Build
# it on a runner and prove the header there: the compile needs several gigabytes
# of headroom that a developer workstation may not have (docs/cutover.md records
# a 3.9 GB Docker VM dying mid-build), and a runner has it.

on:
  push:
    branches: [main]
    paths:
      - "patches/OpenMAIC/**"
      - "upstream.lock.json"
      - "scripts/bootstrap.sh"
      - "docker-compose.yml"
      - ".github/workflows/build-openmaic-image.yml"
  pull_request:
    paths:
      - "patches/OpenMAIC/**"
      - "upstream.lock.json"
      - "scripts/bootstrap.sh"
      - "docker-compose.yml"
      - ".github/workflows/build-openmaic-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  # GITHUB_TOKEN publishes the image; nothing else needs write access.
  packages: write

env:
  IMAGE: ghcr.io/innotelinc/atheniq-evo-openmaic

jobs:
  image:
    name: build, prove the CSP, publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The builder stage is ~4.7 GiB resident and keeps a pnpm store and a
      # Turbopack cache; the runner's default free space is not generous.
      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Fetch OpenMAIC at the pinned commit and apply the patches
        run: bash scripts/bootstrap.sh --only OpenMAIC

      # `docker compose config` refuses to render while a `:?` variable is
      # unset, and a checkout has no .env (it is gitignored). These values are
      # throwaways: the file only has to interpolate, nothing is started here.
      - name: Write a literal .env
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const values = {
            BRIDGE_JWT_SECRET: crypto.randomBytes(32).toString("hex"),
            BRIDGE_SERVICE_TOKEN: crypto.randomBytes(24).toString("hex"),
            BRIDGE_HOOK_SECRET: crypto.randomBytes(24).toString("hex"),
            POSTGRES_PASSWORD: crypto.randomBytes(16).toString("hex"),
            SESSION_SECRET: crypto.randomBytes(32).toString("hex"),
          };
          const lines = fs.readFileSync(".env.example", "utf8").split(/\r?\n/);
          const out = lines.map((line) => {
            const match = /^([A-Z0-9_]+)=/.exec(line);
            if (match && values[match[1]]) return `${match[1]}="${values[match[1]]}"`;
            return line;
          });
          fs.writeFileSync(".env", `${out.join("\n")}\n`);
          '

      # The frame origin is Compose's, not this workflow's. Reading the build
      # argument Compose resolves, and using it for both the build and the
      # assertion, means a change to OPENMAIC_FRAME_ANCESTORS in .env — or to
      # the default in docker-compose.yml — cannot leave CI proving a header
      # the estate does not ship.
      - name: Read the frame origin Compose ships
        id: frame
        run: |
          docker compose config --format json > compose.resolved.json
          node - <<'NODE'
          const fs = require("node:fs");
          const resolved = JSON.parse(fs.readFileSync("compose.resolved.json", "utf8"));
          const args = resolved.services?.openmaic?.build?.args ?? {};
          const value = String(args.ALLOWED_FRAME_ANCESTORS ?? "").trim();
          if (!value) {
            console.error("compose: openmaic has no ALLOWED_FRAME_ANCESTORS build arg");
            process.exit(1);
          }
          if (value.includes("${")) {
            console.error(`compose: ALLOWED_FRAME_ANCESTORS is unresolved: ${value}`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `FRAME_ANCESTORS=${value}\n`);
          console.log(`compose: the image is built with frame-ancestors 'self' ${value}`);
          NODE

      - name: Build the image with the registrar as an allowed ancestor
        run: |
          docker build \
            --build-arg "ALLOWED_FRAME_ANCESTORS=$FRAME_ANCESTORS" \
            --tag openmaic:csp \
            upstream/OpenMAIC

      # The build argument's whole purpose: the image answers with the registrar
      # in frame-ancestors and drops X-Frame-Options, which cannot carry a list
      # and would block the same frame. A CSP captured at build time cannot be
      # inspected in the Dockerfile, so it is asserted on the running image.
      - name: The image serves the registrar frame origin
        run: |
          docker run --detach --name openmaic-csp --publish 13000:3000 \
            --env NODE_ENV=production \
            --env "SESSION_SECRET=$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')" \
            --env "DATABASE_URL=postgres://openmaic:ci@127.0.0.1:5432/openmaic" \
            --env OWNER_SINGLE_USER=false \
            openmaic:csp

          # Any answer will do, including 500: next.config's headers() applies to
          # every source, so the policy is present whatever the page returns.
          for attempt in $(seq 1 60); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:13000/ || true)"
            if [ "$code" != "000" ]; then
              echo "the server answered $code after ${attempt} attempt(s)"
              break
            fi
            sleep 2
          done

          curl --silent --show-error --head http://127.0.0.1:13000/ | tee headers.txt
          grep --quiet --ignore-case \
            "content-security-policy: frame-ancestors 'self' $FRAME_ANCESTORS" headers.txt \
            || { echo "the image does not name $FRAME_ANCESTORS as an ancestor" >&2; exit 1; }
          if grep --quiet --ignore-case '^x-frame-options:' headers.txt; then
            echo "X-Frame-Options is still sent; the registrar's frame will be blocked" >&2
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs openmaic-csp || true

      # GHCR refuses a pull from a token without `read:packages` (this account's
      # carries `repo` and `workflow` only; docs/cutover.md), so the image also
      # goes to a public Docker Hub repository, which anyone can pull. The
      # repository name is derived once here from DOCKERHUB_USERNAME, and both
      # tags below use it, so a push cannot land somewhere the other did not.
      # Unset secrets warn and skip rather than fail: GHCR and the artifact still
      # carry the image, and a fork has no business holding a Hub token.
      - name: Docker Hub repository
        id: hub
        if: github.event_name != 'pull_request'
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Not published to Docker Hub::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish a public copy; this run only pushed to GHCR."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "image=docker.io/${USERNAME}/atheniq-evo-openmaic" >> "$GITHUB_OUTPUT"
          echo "docker hub: docker.io/${USERNAME}/atheniq-evo-openmaic"

      - name: Sign in to Docker Hub
        if: github.event_name != 'pull_request' && steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Deliberately not continue-on-error: Docker Hub is the copy a workstation
      # pulls without a registry scope, so a refusal has to fail the run instead
      # of leaving `latest` quietly behind the commit.
      - name: Publish to Docker Hub
        if: github.event_name != 'pull_request' && steps.hub.outputs.enabled == 'true'
        run: |
          image="${{ steps.hub.outputs.image }}"
          docker tag openmaic:csp "$image:sha-${GITHUB_SHA:0:12}"
          docker tag openmaic:csp "$image:latest"
          docker push "$image:sha-${GITHUB_SHA:0:12}"
          docker push "$image:latest"
          echo "pushed $image:sha-${GITHUB_SHA:0:12} and $image:latest"

      # `docker-compose.yml` and `.env.example` name one manifest by digest, so
      # a checkout cannot pull a build nobody proved. A digest pin is only
      # useful if the next one is easy to find: this prints the reference to
      # paste, and warns when the pin still names an older build — visible in
      # the run that caused the drift, not later in a blank iframe.
      - name: Report the digest to pin
        if: github.event_name != 'pull_request'
        run: |
          digest_of() { sed -n 's/.*atheniq-evo-openmaic@\(sha256:[0-9a-f]\{64\}\).*/\1/p' "$1" | head -1; }
          pinned="$(digest_of docker-compose.yml)"
          pinned_env="$(digest_of .env.example)"
          docker image inspect openmaic:csp --format '{{range .RepoDigests}}{{println .}}{{end}}' > digests.txt
          published="$(digest_of digests.txt)"

          {
            echo '### Classroom image digest'
            echo ''
            if [ -n "$published" ]; then
              echo "- published by this run: \`${published}\`"
            else
              echo '- published by this run: the registries did not report a digest'
            fi
            echo "- pinned in docker-compose.yml: \`${pinned:-none}\`"
            echo "- pinned in .env.example: \`${pinned_env:-none}\`"
            echo ''
            echo 'To deploy exactly this build:'
            echo ''
            echo '```'
            echo "image: \"\${OPENMAIC_IMAGE:-docker.io/innotel/atheniq-evo-openmaic@${published:-sha256:…}}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$published" ] && { [ "$published" != "$pinned" ] || [ "$published" != "$pinned_env" ]; }; then
            echo "::warning title=The classroom digest pin is behind this build::docker-compose.yml and .env.example name $pinned / $pinned_env, this run published $published. Update both when you intend to deploy it; a pull under a digest cannot drift on its own."
          fi

      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The run that first created the package was answered `error from
      # registry: denied` on the manifest; a later run pushed cleanly. A refusal
      # is reported rather than fatal, because the artifact below carries the
      # image either way, and pulling the package needs read:packages anyway
      # (docs/cutover.md).
      - name: Publish
        id: publish
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          docker tag openmaic:csp "$IMAGE:sha-${GITHUB_SHA:0:12}"
          docker tag openmaic:csp "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA:0:12}"
          docker push "$IMAGE:latest"

      - name: Report a refused publish
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning title=Not published to GHCR::The registry refused the manifest; the image is in the openmaic-image artifact and, when the Docker Hub secrets are set, on Docker Hub. Allow packages write in Settings → Actions → Workflow permissions to publish here."

      # A workstation that cannot authenticate to a private package still gets
      # the exact bytes: `gh run download <run> --name openmaic-image`.
      - name: Save the image for a local pull
        if: always()
        run: docker save openmaic:csp | gzip -1 > openmaic-image.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openmaic-image
          path: openmaic-image.tar.gz
          retention-days: 7
          compression-level: 0
